[project]
name = "project-5"
version = "0.1.0"
description = ""
authors = [
    { name = "Evgenii_Lobachev", email = "lobachev9614@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
black = "^26.3.1"
isort = "^8.0.1"
mypy = "^1.20.1"
flake8 = "^7.3.0"


[tool.poetry.group.dev.dependencies]
django = "^6.0.4"
django-stubs = "^6.0.2"
pillow = "^12.2.0"
psycopg2 = "^2.9.11"
python-dotenv = "^1.2.2"
djangorestframework = "^3.17.1"
django-phonenumber-field = "^8.4.0"
phonenumbers = "^9.0.28"
django-cleanup = "^9.0.0"
django-filter = "^25.2"
djangorestframework-simplejwt = "^5.5.1"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ['.venv', 'tests', 'idea', 'git', '.coverage', 'logs', 'static', 'media']

[tool.isort]
profile = "black"
line_length = 119

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.git
      \.idea
      \.venv
      \.coverage
      \.static
  )/
)
'''
